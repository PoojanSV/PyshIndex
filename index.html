<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:description" content="Honest, community-driven game reviews. Browse Dropped, Good, and Goated verdicts on Pysh Index and add your own.">
    <meta property="og:url" content="https://pysh.site/">
    <meta property="og:image" content="https://pysh.site/logo.png">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pysh Index - Game Reviews, Ratings & Community Verdicts">
    <meta name="twitter:description" content="Honest, community-driven game reviews. Browse Dropped, Good, and Goated verdicts on Pysh Index and add your own.">
    <meta name="twitter:image" content="https://pysh.site/logo.png">
    <meta name="twitter:site" content="@pyshgames">

    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#e1282d">

    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Pysh Index",
            "alternateName": ["Pysh", "Pysh Games"],
            "url": "https://pysh.site/",
            "description": "Pysh Index is Pysh Games' home for honest, community-driven game reviews, ratings, and verdicts.",
            "publisher": {
                "@type": "Organization",
                "name": "Pysh Games",
                "url": "https://pysh.site/",
                "logo": "https://pysh.site/logo.png",
                "sameAs": [
                    "https://www.youtube.com/pyshgames",
                    "https://www.instagram.com/pyshgames",
                    "https://www.x.com/pyshgames"
                ]
            },
            "potentialAction": {
                "@type": "SearchAction",
                "target": {
                    "@type": "EntryPoint",
                    "urlTemplate": "https://pysh.site/?q={search_term_string}"
                },
                "query-input": "required name=search_term_string"
            }
        }
    </script>

    <style>
        /* =========================================================
           ROOT / SCALE
           ========================================================= */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --red: #e1282d;
            --bg: #000;
            --panel: #111;
            --muted: #ccc;

            --container-w: min(1400px, 94vw);

            --gap: clamp(8px, 2.2vw, 32px);
            --gap-sm: clamp(6px, 1.2vw, 18px);

            --radius-lg: clamp(14px, 2vw, 30px);
            --radius-md: clamp(10px, 1.3vw, 20px);
            --radius-sm: clamp(8px, 1vw, 15px);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            font-family: Arial, sans-serif;
            margin: 0;
            color: white;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* HEADER */
        header {
            padding: clamp(6px, 1vw, 10px) 0;
            background-color: #111;
			border-bottom:5px solid var(--red);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: var(--container-w);
            margin: 0 auto;
            padding: 0 clamp(16px, 2.5vw, 40px);
        }

        #logoLink {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            margin-left: clamp(10px, 1.8vw, 25px);
        }

        #l {
            width: clamp(100px, 11vw, 180px);
            height: auto;
            display: block;
        }

        #right {
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.3vw, 18px);
            margin-right: clamp(8px, 1.5vw, 20px);
        }

        /* LARGE, HEADER-FILLING NAV ICONS (NO SCALE ANIMATIONS) */
        .headerNavIcon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: clamp(48px, 4.2vw, 58px);
            height: clamp(48px, 4.2vw, 58px);
            color: var(--muted);
            background: none;
            border: 2px solid transparent;
            border-radius: 50%;
            padding: 0;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, color 0.2s ease;
            flex-shrink: 0;
        }

        .headerNavIcon svg {
            width: 68%;
            height: 68%;
            pointer-events: none;
        }

        /* Profile Button in Desktop Header */
        .profileBtn {
            padding: 0;
            overflow: hidden;
            margin-right: clamp(12px, 1.8vw, 26px); /* Shifts Profile more to the left */
        }

        .profileBtn #profileIcon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0;
        }

        /* SEARCH SIDE PANEL */
        #searchOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 1999;
        }
        #searchOverlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        #searchPanel {
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: min(100vw, max(380px, 33vw));
            background: #111;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.35s ease;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            padding: clamp(24px, 3vw, 48px) clamp(24px, 3vw, 44px);
        }

        #searchPanel.open {
            transform: translateX(0);
        }

        .searchInputWrap {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #000;
            border: 2px solid var(--red);
            border-radius: var(--radius-sm);
            padding: clamp(10px, 1.1vw, 16px) clamp(14px, 1.4vw, 20px);
            margin: 6px 0 24px;
        }
        .searchInputWrap svg {
            width: clamp(20px, 1.6vw, 26px);
            height: clamp(20px, 1.6vw, 26px);
            color: var(--muted);
            flex-shrink: 0;
            pointer-events: none;
        }

        .searchPanelInput {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            color: white;
            font-family: inherit;
            font-size: clamp(16px, 1.3vw, 20px);
        }
        .searchPanelInput:focus {
            outline: none;
        }

        .searchResultsPanel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .searchResultItem {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: clamp(10px, 1vw, 14px);
            border-radius: 10px;
            cursor: pointer;
        }
        .searchResultItem:hover {
            background: rgba(225, 40, 45, 0.15);
        }
        .searchResultItem img {
            width: clamp(50px, 4.2vw, 68px);
            height: clamp(64px, 5.4vw, 86px);
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .searchResultItem span {
            color: white;
            font-size: clamp(16px, 1.3vw, 20px);
        }
        .searchNoResults,
        .searchHint {
            color: #888;
            font-size: clamp(14px, 1.1vw, 17px);
            padding: 24px 10px;
            text-align: center;
        }

        /* AUTH NAV */
        nav a.nav-auth {
            font-size: clamp(16px, 1.1vw, 24px);
            padding: clamp(6px, 0.8vw, 10px) clamp(8px, 1.2vw, 15px);
            border: 2px solid var(--red);
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }
        nav a.nav-auth:hover {
            background: var(--red);
            color: white;
        }

        hr {
            background-color: var(--red);
            height: 5px;
            border: solid var(--red);
        }

        /* LOADER - SKELETON */
        #loader {
            width: var(--container-w);
            margin: clamp(24px, 4vw, 40px) auto;
        }

        .skeletonGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
        }

        .skeletonCard {
            background: #111;
            border: 3px solid var(--red);
            border-radius: var(--radius-lg);
            padding: clamp(10px, 1.6vw, 20px);
            display: flex;
            flex-direction: column;
        }

        .skeletonImg {
            width: 100%;
            aspect-ratio: 7 / 9;
            border-radius: var(--radius-md);
        }

        .skeletonTitle {
            height: clamp(14px, 1.6vw, 22px);
            width: 65%;
            border-radius: 6px;
            margin: clamp(8px, 1vw, 15px) auto 0;
        }

        .skeletonImg,
        .skeletonTitle {
            background: linear-gradient(90deg, #161616 25%, #262626 37%, #161616 63%);
            background-size: 400% 100%;
            animation: skeletonShimmer 1.4s ease-in-out infinite;
        }

        @keyframes skeletonShimmer {
            0% {
                background-position: 100% 0;
            }
            100% {
                background-position: -100% 0;
            }
        }

        /* TITLE ROW / FILTER BUTTONS */
        #titleRow {
            width: var(--container-w);
            margin: clamp(24px, 4vw, 40px) auto;
            display: flex;
            justify-content: center;
        }

        .btnGroup {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            width: 100%;
        }

        .boxBtn {
            background: #111;
            border: 3px solid var(--red);
            color: white;
            width: 100%;
            margin: 0;
            padding: clamp(10px, 1.4vw, 14px) clamp(10px, 1.6vw, 20px);
            font-size: clamp(14px, 1.8vw, 26px);
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .boxBtn:hover {
            background: var(--red);
        }

        h1 {
            font-size: clamp(28px, 5vw, 60px);
            margin: 0 clamp(10px, 2vw, 30px);
            white-space: nowrap;
        }

        /* REVIEWS GRID */
        #reviews {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            width: var(--container-w);
            margin: clamp(30px, 5vw, 50px) auto;
            perspective: 1200px;
        }

        /* CARD */
        .card {
            background: #111;
            border: 3px solid var(--red);
            border-radius: var(--radius-lg);
            padding: clamp(10px, 1.6vw, 20px);
            text-align: center;
            transition: transform 0.35s ease;
            overflow: visible;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .imgWrap {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-md);
        }

        .card img {
            width: 100%;
            aspect-ratio: 7 / 9;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            display: block;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .imgWrap::before {
            content: '';
            position: absolute;
            top: -120%;
            left: -150%;
            width: 200%;
            height: 200%;
            background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
            transform: rotate(25deg);
            transition: top 0.7s ease, left 0.7s ease;
            pointer-events: none;
            z-index: 2;
        }

        .card h3 {
            margin: clamp(8px, 1vw, 15px) 0 0;
            font-size: clamp(11px, 1.6vw, 26px);
            color: white;
            width: 100%;
            text-align: center;
            line-height: 1.25;
        }

        .card:hover img {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(225, 40, 45, 0.35);
        }
        .card:hover .imgWrap::before {
            top: -20%;
            left: -20%;
        }

        /* TRENDING SECTION */
        #trendingSection {
            display: none;
            width: var(--container-w);
            margin: clamp(20px, 4vw, 40px) auto clamp(40px, 6vw, 60px);
        }

        #trendingHeading {
            font-size: clamp(22px, 3.2vw, 38px);
            text-align: center;
            margin: 0 0 clamp(18px, 2.6vw, 32px);
            color: white;
        }

        #trendingGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            perspective: 1200px;
        }

        /* FULL REVIEW PAGE */
        #reviewPage {
            display: none;
            width: var(--container-w);
            margin: clamp(40px, 6vw, 60px) auto;
            gap: var(--gap);
            align-items: flex-start;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.45s ease, transform 0.45s ease;
            box-sizing: border-box;
        }

        @media (min-width: 641px) {
            #reviewPage {
                padding: 0 clamp(20px, 4vw, 70px);
            }
        }

        #reviewPage.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #reviewPage img {
            flex: 1 1 260px;
            max-width: 350px;
            width: 100%;
            border-radius: var(--radius-lg);
            border: 3px solid var(--red);
        }

        #reviewContent {
            flex: 2 1 320px;
            min-width: 0;
        }
        #reviewContent #reviewTitle {
            font-size: 50px;
        }
        #reviewContent p {
            color: grey;
            font-size: clamp(16px, 1.8vw, 26px);
            line-height: 1.5;
            max-width: 700px;
        }

        #reviewDescription {
            color: #ccc;
            font-size: clamp(14px, 1.3vw, 20px);
            line-height: 1.5;
            max-width: 600px;
            margin-bottom: clamp(16px, 2vw, 25px);
        }

        #reviewMetaBadge {
            margin: 0 0 10px;
        }

        #back {
            background: var(--red);
            color: white;
            border: none;
            padding: clamp(10px, 1.2vw, 12px) clamp(18px, 2vw, 25px);
            font-size: clamp(15px, 1.2vw, 18px);
            border-radius: var(--radius-sm);
            margin-top: clamp(20px, 3vw, 30px);
            cursor: pointer;
            display: block;
        }


        /* FOOTER */
        footer {
            background-color: #111;
            padding-bottom: clamp(20px, 4vw, 30px);
            font-size: clamp(13px, 1.4vw, 20px);
        }

        #f {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(16px, 3vw, 50px);
        }
        #f a {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--muted);
        }

        .fIconWrap {
            width: clamp(20px, 1.8vw, 26px);
            height: clamp(20px, 1.8vw, 26px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .fIconWrap img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            margin: 0 auto;
        }

        #lf {
            height: clamp(60px, 6vw, 100px);
            width: clamp(60px, 6vw, 100px);
            display: block;
            margin: 0 auto;
        }

        #c {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: center;
            width: 100%;
            color: var(--muted);
            margin-top: 14px;
            text-align: center;
        }

        #c>div {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        /* ACTIVE BUTTON STYLE */
        .active {
            background: var(--red) !important;
            color: white !important;
        }

        /* COMMUNITY REVIEWS SECTION */
        #communitySection {
            display: none;
            width: min(1400px, 94vw);
            margin: 20px auto 60px;
            box-sizing: border-box;
        }

        @media (min-width: 641px) {
            #communitySection {
                padding: 0 clamp(20px, 4vw, 70px);
            }
        }

        #communitySection h3 {
            font-size: clamp(26px, 1.8vw, 29px);
            color: var(--red);
            border-bottom: 2px solid var(--red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        #avgBadgeWrap {
            margin: 0 0 30px;
            font-size: clamp(13px, 1.3vw, 16px);
        }
        #avgBadgeWrap .avg-label {
            color: var(--muted);
            margin-right: 10px;
        }

        #avgBadge {
            font-weight: bold;
            padding: 5px 16px;
            border-radius: 20px;
            border: 2px solid #555;
            color: #888;
        }

        #avgBadge.avg-Goated {
            color: limegreen;
            border-color: limegreen;
        }
        #avgBadge.avg-Good {
            color: dodgerblue;
            border-color: dodgerblue;
        }
        #avgBadge.avg-Dropped {
            color: yellow;
            border-color: yellow;
        }

        #reviewForm {
            background: #111;
            border: 2px solid var(--red);
            border-radius: var(--radius-md);
            padding: clamp(15px, 2vw, 20px) clamp(16px, 2.2vw, 25px);
            margin-bottom: 35px;
        }

        #reviewForm label {
            display: block;
            margin: 12px 0 6px;
            color: var(--muted);
            font-size: 15px;
        }

        #reviewForm input[type="text"],
        #reviewForm select,
        #reviewForm textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #000;
            color: white;
            font-family: inherit;
            font-size: 18px;
        }

        #reviewForm textarea {
            min-height: 90px;
            resize: vertical;
        }

        #commentName[readonly] {
            color: var(--muted);
            border-color: #444;
            cursor: not-allowed;
        }
        #commentName.owner-name[readonly] {
            color: var(--red);
            font-weight: bold;
            border-color: var(--red);
        }

        #submitReviewBtn {
            margin-top: 18px;
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 26px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
        #submitReviewBtn:hover {
            background: white;
            color: var(--red);
        }

        #reviewFormMsg {
            margin-top: 12px;
            font-size: 14px;
        }

        .commentCard {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }

        .commentCard .commentHead {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .commentCard .commentName {
            font-weight: bold;
            font-size: 18px;
            color: white;
        }
        .commentCard .commentName.owner {
            color: var(--red);
        }

        .commentCard .commentRating {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .rating-Goated {
            background: rgba(50, 205, 50, 0.2);
            color: limegreen;
        }
        .rating-Good {
            background: rgba(30, 144, 255, 0.2);
            color: dodgerblue;
        }
        .rating-Dropped {
            background: rgba(255, 255, 0, 0.2);
            color: yellow;
        }

        .commentCard .commentText {
            color: var(--muted);
            font-size: 17px;
            line-height: 1.4;
        }

        #noComments {
            color: #888;
            font-size: 14px;
        }

        .commentAvatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            vertical-align: middle;
        }

        .commentCard.pinned {
            border-color: var(--red);
        }

        .pinnedTag {
            font-size: 10px;
            color: #888;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 2px 8px;
            margin-left: 4px;
        }

        .commentActions {
            margin-top: 10px;
        }

        .replyToggleBtn,
        .editReviewBtn,
        .deleteReviewBtn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 0;
            margin-right: 16px;
            font-family: inherit;
        }
        .replyToggleBtn:hover,
        .editReviewBtn:hover {
            color: var(--red);
        }
        .deleteReviewBtn:hover {
            color: #ff5c5c;
        }
        .deleteReviewBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .deleteMsg {
            margin: -6px 0 6px;
            font-size: 11px;
            min-height: 14px;
        }

        .editReviewWrap {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .editRatingSelect {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #000;
            color: white;
            font-family: inherit;
            font-size: 15px;
            width: 100%;
        }

        .editTextArea {
            width: 100%;
            min-height: 70px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #000;
            color: white;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
        }

        .editSaveBtn,
        .editCancelBtn {
            margin-top: 4px;
            margin-right: 8px;
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .editSaveBtn {
            background: var(--red);
            color: white;
        }
        .editSaveBtn:hover {
            background: white;
            color: var(--red);
        }

        // ---- Community Verdict helper ----
        // Returns 'Dropped' | 'Good' | 'Goated' | null (null = no reviews)
        function computeVerdict(comments) {
            if (!comments || comments.length === 0) return null;
            const values = { Dropped: 1, Good: 2, Goated: 3 };
            const order = ['Dropped', 'Good', 'Goated'];
            const sum = comments.reduce((t, c) => t + (values[c.rating] || 2), 0);
            const mean = sum / comments.length;
            const idx = Math.max(0, Math.min(2, Math.round(mean) - 1));
            return order[idx];
        }

        async function persistVerdict(reviewId, comments) {
            const verdict = computeVerdict(comments);
            try {
                await updateDoc(doc(db, 'reviews', reviewId), {
                    communityVerdict: verdict || null,
                    category: verdict || null
                });
                // Update local cache so filters work without reload
                const cached = allReviews.find(r => r.id === reviewId);
                if (cached) {
                    cached.communityVerdict = verdict || null;
                    cached.category = verdict || null;
                }
            } catch (e) {
                console.warn('Could not persist community verdict:', e);
            }

        async function loadAllData() {
            try {
                const reviewsQuery = query(collection(db, "reviews"), orderBy("createdAt", "desc"));
                const reviewsSnapshot = await getDocs(reviewsQuery);
                allReviews = [];
                reviewsSnapshot.forEach(doc => {
                    const data = doc.data();
                    allReviews.push({
                        id: doc.id,
                        ...data,
                        communityVerdict: data.communityVerdict || null
                    });
                });

                await preloadImages(allReviews);

                renderReviews(allReviews);

                hideLoader();
                showReviews();

                // Auto-sync any legacy reviews that don't have communityVerdict set yet
                const pendingVerdicts = allReviews.filter(r => !r.communityVerdict);
                if (pendingVerdicts.length > 0) {
                    Promise.all(pendingVerdicts.map(async (r) => {
                        try {
                            const cSnap = await getDocs(collection(db, "reviews", r.id, "comments"));
                            const comments = [];
                            cSnap.forEach(d => comments.push(d.data()));
                            const verdict = computeVerdict(comments);

                                    category: verdict

                                    renderReviews(allReviews.filter(item => item.communityVerdict === currentFilter));
                                }
                            }
                        } catch (err) {
                            console.warn("Could not check comments for review:", r.id, err);
                        }
                    }));
                }
            } catch (error) {
                console.error("Error loading data:", error);
                hideLoader();
                alert("Error loading data. Please refresh the page.");
            }
        }

        function hideLoader() {
            loader.style.display = "none";
        }

        function preloadImages(items) {
            return new Promise((resolve) => {
                let loadedImages = 0;
                const totalImages = items.length;

                if (totalImages === 0) {
                    resolve();
                    return;
                }

                items.forEach(item => {
                    const img = new Image();
                    img.src = item.imageUrl;
                    img.onload = () => {
                        loadedImages++;
                        if (loadedImages === totalImages) resolve();
                    };
                    img.onerror = () => {
                        loadedImages++;
                        if (loadedImages === totalImages) resolve();
                    };
                });
            });
        }

        function renderReviews(list) {

                return;

            list.forEach(r => {

                img.alt = r.title;

                card.appendChild(wrap);

        function skeletonCardsHTML(count) {
            let html = "";
            for (let i = 0; i < count; i++) {

            }
            return html;

        // Normalizes a Firestore Timestamp, plain ms number, or date string into ms since epoch.
        function toMillis(value) {
            if (value == null) return 0;
            if (typeof value === "number") return value;
            if (typeof value.toDate === "function") return value.toDate().getTime();
            if (typeof value.seconds === "number") return value.seconds * 1000;
            const parsed = Date.parse(value);
            return isNaN(parsed) ? 0 : parsed;
        }

        // Number of people who've left a review (comment) on a game, cached until invalidated.
        async function getInteractionCount(reviewId) {
            if (trendingStatsCache[reviewId] !== undefined) {
                return trendingStatsCache[reviewId];
            }
            try {
                const snap = await getDocs(collection(db, "reviews", reviewId, "comments"));
                trendingStatsCache[reviewId] = snap.size;
                return snap.size;
            } catch (err) {
                console.warn("Could not get interaction count for", reviewId, err);
                return 0;
            }
        }

        // Recency-weighted score: interactions matter most relative to how long a game
        // has been listed, so a freshly-listed game with lots of reviews ranks above an
        // older game with the same (or even a somewhat larger) total review count, and a
        // recently-listed game with a decent but smaller review count settles in below it.
        function computeTrendingScore(review, interactionCount) {
            const listedAt = toMillis(review.createdAt);
            const ageHours = Math.max(0, (Date.now() - listedAt) / 3600000);
            const gravity = 1.5;
            return interactionCount / Math.pow(ageHours + 2, gravity);
        }

        async function loadTrendingGames() {
            const scored = await Promise.all(allReviews.map(async (r) => {
                const interactionCount = await getInteractionCount(r.id);
                const trendingScore = computeTrendingScore(r, interactionCount);
                return { ...r, interactionCount, trendingScore };
            }));

            scored.sort((a, b) => {
                if (b.trendingScore !== a.trendingScore) return b.trendingScore - a.trendingScore;
                return toMillis(b.createdAt) - toMillis(a.createdAt);
            });

            return scored.slice(0, 12);
        }

        function renderTrending(list) {
            trendingGrid.innerHTML = "";

            if (list.length === 0) {
                trendingGrid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; font-size: 24px; color: #888;">No trending games yet</p>';
                return;
            }

            list.forEach((r) => {
                const img = document.createElement("img");
                img.src = r.imageUrl;
                img.alt = r.title;
                img.onclick = () => openReviewPage(r, true);

                const wrap = document.createElement("div");
                wrap.className = "imgWrap";
                wrap.appendChild(img);

                const title = document.createElement("h3");
                title.textContent = r.title;

                const card = document.createElement("div");
                card.className = "card";

                card.appendChild(wrap);
                card.appendChild(title);

                trendingGrid.appendChild(card);
            });
        }

        async function showTrending(e) {
            if (e) e.preventDefault();
            closeSearch();
            closeSettings();
            closeProfilePanel();

            reviewsDiv.style.display = "none";
            reviewPage.style.display = "none";
            communitySection.style.display = "none";
            trendingSection.style.display = "block";
            currentFilter = null;
            updateButtonStates('trending');
            setPrimaryNavIcon('trending');

            trendingGrid.innerHTML = skeletonCardsHTML(12);

            if (dataReadyPromise) {
                try { await dataReadyPromise; } catch (_) { /* handled by loadAllData */ }
            }

            try {
                const top = await loadTrendingGames();
                renderTrending(top);
            } catch (err) {
                console.error("Error loading trending games:", err);
                trendingGrid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; font-size: 18px; color: #888;">Could not load trending games. Please try again.</p>';
            }
        }

        // Filter functions
        window.filterCategory = (cat) => {
            if (currentFilter === cat) {
                currentFilter = null;
                renderReviews(allReviews);
                showReviews();
                updateButtonStates('reviews');
                return;
            }
            currentFilter = cat;
            // Filter strictly relies on community verdict
            const filtered = allReviews.filter(r => r.communityVerdict === cat);
            renderReviews(filtered);
            showReviews();

            updateButtonStates('reviews');
        };

        backBtn.onclick = () => {
            reviewPage.style.display = "none";
            reviewPage.classList.remove("visible");
            if (cameFromTrending) {
                cameFromTrending = false;
                showTrending();
            } else {
                showReviews();
            }
        };

        // ---- Community Reviews ----
        function setupCommentNameField() {
            const session = getSession();

            if (!session) {
                reviewForm.style.display = "none";
                guestBlock.style.display = "block";
                alreadyReviewedMsg.style.display = "none";
                return;
            }

            reviewForm.style.display = "";
            guestBlock.style.display = "none";
            alreadyReviewedMsg.style.display = "none";

            if (session.role === "admin") {
                commentName.value = "Pysh";
                commentName.readOnly = true;
                commentName.classList.add("owner-name");
            } else {
                commentName.value = session.username;
                commentName.readOnly = true;
                commentName.classList.remove("owner-name");
            }
        }

        function resetReviewForm() {
            commentRating.value = "";
            commentText.value = "";
            reviewFormMsg.textContent = "";
        }

        function isOwnComment(c, session) {
            if (!session || c.pinned) return false;
            if (c.userId) return c.userId === session.id;
            const displayName = session.role === "admin" ? "Pysh" : session.username;
            return c.name === displayName;
        }

        function findOwnReview(session) {
            if (!session) return null;
            return currentComments.find(c => isOwnComment(c, session)) || null;
        }

        function updateReviewFormAvailability() {
            const session = getSession();
            if (!session) return;

            if (findOwnReview(session)) {
                reviewForm.style.display = "none";
                alreadyReviewedMsg.style.display = "block";
            } else {
                alreadyReviewedMsg.style.display = "none";
                reviewForm.style.display = "";
            }
        }

        async function loadComments(reviewId) {
            commentsList.innerHTML = '<p id="noComments">Loading reviews...</p>';
            repliesCache = {};
            try {
                const q = query(collection(db, "reviews", reviewId, "comments"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                currentComments = [];
                snapshot.forEach(d => currentComments.push({ id: d.id, ...d.data() }));

                // No longer inject a fake pinned admin review —
                // the community verdict is calculated from actual reviews only.

                renderComments();
                renderAverage();
                updateReviewFormAvailability();

                // Persist the updated community verdict back to Firestore
                await persistVerdict(reviewId, currentComments);
            } catch (error) {
                console.error("Error loading community reviews:", error);
                commentsList.innerHTML = '<p id="noComments">Could not load reviews right now.</p>';
            }
        }

        function renderComments() {
            if (currentComments.length === 0) {
                commentsList.innerHTML = '<p id="noComments">No reviews yet — be the first!</p>';
                return;
            }

            const session = getSession();

            commentsList.innerHTML = currentComments.map(c => {
                const canEdit = isOwnComment(c, session);
                return `
                <div class="commentCard ${c.pinned ? 'pinned' : ''}">
                  <div class="commentHead">
                    <img class="commentAvatar" src="${c.photoURL || DEFAULT_AVATAR}" alt="">
                    <span class="commentName ${c.isOwner ? 'owner' : ''}">${c.isOwner ? 'Pysh' : escapeHtml(c.name)}</span>
                    <span class="commentRating rating-${c.rating}">${c.rating}</span>
                  </div>
                  <div class="commentText">${escapeHtml(c.text)}</div>

                  <div class="commentActions">
                    ${canEdit ? `<button class="editReviewBtn" data-comment-id="${c.id}">Edit</button>` : ''}
                    ${canEdit ? `<button class="deleteReviewBtn" data-comment-id="${c.id}">Delete</button>` : ''}
                    <button class="replyToggleBtn" data-comment-id="${c.id}">Reply</button>
                  </div>
                  ${canEdit ? `<div class="deleteMsg" id="deleteMsg-${c.id}"></div>` : ''}

                  ${canEdit ? `
                    <div class="editReviewWrap" id="editWrap-${c.id}" style="display:none;">
                      <label for="editRating-${c.id}">Your Rating</label>
                      <select class="editRatingSelect" id="editRating-${c.id}">
                        <option value="Dropped" ${c.rating === 'Dropped' ? 'selected' : ''}>Dropped</option>
                        <option value="Good" ${c.rating === 'Good' ? 'selected' : ''}>Good</option>
                        <option value="Goated" ${c.rating === 'Goated' ? 'selected' : ''}>Goated</option>
                      </select>
                      <textarea class="editTextArea" id="editText-${c.id}">${escapeHtml(c.text)}</textarea>
                      <div>
                        <button class="editSaveBtn" data-comment-id="${c.id}">Save</button>
                        <button class="editCancelBtn" data-comment-id="${c.id}">Cancel</button>
                      </div>
                      <div class="editMsg" id="editMsg-${c.id}"></div>
                    </div>
                  ` : ''}

                  <div class="repliesWrap" id="repliesWrap-${c.id}" style="display:none;">
                    <div class="repliesList" id="repliesList-${c.id}"></div>

                    ${session ? `
                      <div class="replyForm">
                        <textarea class="replyText" id="replyText-${c.id}" placeholder="Write a reply..."></textarea>
                        <button class="replySubmitBtn" data-comment-id="${c.id}">Post Reply</button>
                        <div class="replyMsg" id="replyMsg-${c.id}"></div>
                      </div>
                    ` : `
                      <div class="replyGuestBlock"><a href="login.html">Sign in</a> to reply.</div>
                    `}
                  </div>
                </div>
              `;
            }).join('');
        }

        // ---- Reply threads ----
        async function fetchReplies(commentId) {
            const q = query(
                collection(db, "reviews", currentReviewId, "comments", commentId, "replies"),
                orderBy("createdAt", "asc")
            );
            const snapshot = await getDocs(q);
            const replies = [];
            snapshot.forEach(d => replies.push({ id: d.id, ...d.data() }));
            return replies;
        }

        function renderReplies(commentId) {
            const listEl = document.getElementById(`repliesList-${commentId}`);
            if (!listEl) return;
            const replies = repliesCache[commentId] || [];

            if (replies.length === 0) {
                listEl.innerHTML = '<p class="noReplies">No replies yet.</p>';
                return;
            }

            listEl.innerHTML = replies.map(r => `
                <div class="replyCard">
                  <div class="commentHead">
                    <img class="commentAvatar" src="${r.photoURL || DEFAULT_AVATAR}" alt="">
                    <span class="commentName ${r.isOwner ? 'owner' : ''}">${r.isOwner ? 'Pysh' : escapeHtml(r.name)}</span>
                  </div>
                  <div class="commentText">${escapeHtml(r.text)}</div>
                </div>
              `).join('');
        }

        async function toggleReplies(commentId) {
            const wrap = document.getElementById(`repliesWrap-${commentId}`);
            if (!wrap) return;

            const isOpen = wrap.style.display !== "none";
            if (isOpen) {
                wrap.style.display = "none";
                return;
            }

            wrap.style.display = "block";

            if (!repliesCache[commentId]) {
                const listEl = document.getElementById(`repliesList-${commentId}`);
                if (listEl) listEl.innerHTML = '<p class="noReplies">Loading replies...</p>';
                try {
                    repliesCache[commentId] = await fetchReplies(commentId);
                } catch (error) {
                    console.error("Error loading replies:", error);
                    repliesCache[commentId] = [];
                }
            }

            renderReplies(commentId);
        }

        async function postReply(commentId) {
            const session = getSession();
            const msgEl = document.getElementById(`replyMsg-${commentId}`);
            if (!session) {
                if (msgEl) {
                    msgEl.style.color = "#e1282d";
                    msgEl.textContent = "Please sign in to reply.";
                }
                return;
            }

            const textarea = document.getElementById(`replyText-${commentId}`);
            const text = textarea ? textarea.value.trim() : "";
            if (!text) {
                if (msgEl) {
                    msgEl.style.color = "#e1282d";
                    msgEl.textContent = "Write something before posting.";
                }
                return;
            }

            const submitBtn = document.querySelector(`.replySubmitBtn[data-comment-id="${commentId}"]`);
            if (submitBtn) submitBtn.disabled = true;
            if (msgEl) {
                msgEl.style.color = "#ccc";
                msgEl.textContent = "Posting...";
            }

            const isOwner = session.role === "admin";
            const name = isOwner ? "Pysh" : session.username;

            try {
                await addDoc(collection(db, "reviews", currentReviewId, "comments", commentId, "replies"), {
                    name,
                    text,
                    isOwner,
                    userId: session.id,
                    photoURL: session.photoURL || null,
                    createdAt: Date.now()
                });

                textarea.value = "";
                if (msgEl) {
                    msgEl.style.color = "limegreen";
                    msgEl.textContent = "Reply posted!";
                }

                repliesCache[commentId] = await fetchReplies(commentId);
                renderReplies(commentId);
            } catch (error) {
                console.error("Error posting reply:", error);
                if (msgEl) {
                    msgEl.style.color = "#e1282d";
                    msgEl.textContent = "Error posting reply. Please try again.";
                }
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        // ---- Own-review editing ----
        function toggleEditReview(commentId, forceOpen) {
            const wrap = document.getElementById(`editWrap-${commentId}`);
            if (!wrap) return;
            const isOpen = wrap.style.display !== "none";
            const nextOpen = forceOpen !== undefined ? forceOpen : !isOpen;
            wrap.style.display = nextOpen ? "block" : "none";
        }

        async function saveEditedReview(commentId) {
            const session = getSession();
            const msgEl = document.getElementById(`editMsg-${commentId}`);
            if (!session) return;

            const ratingSelect = document.getElementById(`editRating-${commentId}`);
            const textarea = document.getElementById(`editText-${commentId}`);
            const rating = ratingSelect ? ratingSelect.value : "";
            const text = textarea ? textarea.value.trim() : "";

            if (!rating) {
                if (msgEl) { msgEl.style.color = "#e1282d";
                    msgEl.textContent = "Please select a rating."; }
                return;
            }
            if (!text) {
                if (msgEl) { msgEl.style.color = "#e1282d";
                    msgEl.textContent = "Review can't be empty."; }
                return;
            }

            const saveBtn = document.querySelector(`.editSaveBtn[data-comment-id="${commentId}"]`);
            if (saveBtn) saveBtn.disabled = true;
            if (msgEl) { msgEl.style.color = "#ccc";
                msgEl.textContent = "Saving..."; }

            try {
                await updateDoc(doc(db, "reviews", currentReviewId, "comments", commentId), {
                    rating,
                    text
                });
                await loadComments(currentReviewId);
            } catch (error) {
                console.error("Error updating review:", error);
                if (msgEl) {
                    msgEl.style.color = "#e1282d";
                    msgEl.textContent = "Could not save changes. Please try again.";
                }
                if (saveBtn) saveBtn.disabled = false;
            }
        }

        async function deleteReview(commentId) {
            const session = getSession();
            if (!session) return;

            const confirmed = window.confirm("Delete your review? This can't be undone.");
            if (!confirmed) return;

            const msgEl = document.getElementById(`deleteMsg-${commentId}`);
            const deleteBtn = document.querySelector(`.deleteReviewBtn[data-comment-id="${commentId}"]`);
            if (deleteBtn) deleteBtn.disabled = true;
            if (msgEl) { msgEl.style.color = "#ccc";
                msgEl.textContent = "Deleting..."; }

            try {
                const repliesSnap = await getDocs(
                    collection(db, "reviews", currentReviewId, "comments", commentId, "replies")
                );
                await Promise.all(repliesSnap.docs.map(d => deleteDoc(d.ref)));

                await deleteDoc(doc(db, "reviews", currentReviewId, "comments", commentId));

                delete repliesCache[commentId];
                delete trendingStatsCache[currentReviewId];
                await loadComments(currentReviewId);
            } catch (error) {
                console.error("Error deleting review:", error);
                if (msgEl) {
                    msgEl.style.color = "#e1282d";
                    msgEl.textContent = "Could not delete review. Please try again.";
                }
                if (deleteBtn) deleteBtn.disabled = false;
            }
        }

        // Delegated listener for all comment actions
        commentsList.addEventListener("click", (e) => {
            const toggleBtn = e.target.closest(".replyToggleBtn");
            if (toggleBtn) {
                toggleReplies(toggleBtn.dataset.commentId);
                return;
            }

            const submitBtn = e.target.closest(".replySubmitBtn");
            if (submitBtn) {
                postReply(submitBtn.dataset.commentId);
                return;
            }

            const editBtn = e.target.closest(".editReviewBtn");
            if (editBtn) {
                toggleEditReview(editBtn.dataset.commentId);
                return;
            }

            const saveBtn = e.target.closest(".editSaveBtn");
            if (saveBtn) {
                saveEditedReview(saveBtn.dataset.commentId);
                return;
            }

            const cancelBtn = e.target.closest(".editCancelBtn");
            if (cancelBtn) {
                toggleEditReview(cancelBtn.dataset.commentId, false);
                return;
            }

            const deleteBtn = e.target.closest(".deleteReviewBtn");
            if (deleteBtn) {
                deleteReview(deleteBtn.dataset.commentId);
            }
        });

        // Average verdict
        function renderAverage() {
            const verdict = computeVerdict(currentComments);
            if (!verdict) {
                avgBadge.textContent = "No reviews yet";
                avgBadge.className = "";
                return;
            }

            avgBadge.textContent = verdict.toUpperCase();
            avgBadge.className = "avg-" + verdict;
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str || "";
            return div.innerHTML;
        }

        submitReviewBtn.addEventListener("click", async () => {
            if (!currentReviewId) return;

            const session = getSession();
            if (!session) {
                reviewFormMsg.style.color = "#e1282d";
                reviewFormMsg.textContent = "Please sign in to post a review.";
                return;
            }

            const rating = commentRating.value;
            const text = commentText.value.trim();

            if (!rating) {
                reviewFormMsg.style.color = "#e1282d";
                reviewFormMsg.textContent = "Please select a rating.";
                return;
            }
            if (!text) {
                reviewFormMsg.style.color = "#e1282d";
                reviewFormMsg.textContent = "Please write a short review.";
                return;
            }

            if (findOwnReview(session)) {
                reviewFormMsg.style.color = "#e1282d";
                reviewFormMsg.textContent = "You've already reviewed this game. Edit your existing review instead.";
                updateReviewFormAvailability();
                return;
            }

            const isOwner = session.role === "admin";
            const name = isOwner ? "Pysh" : session.username;

            submitReviewBtn.disabled = true;
            reviewFormMsg.style.color = "#ccc";
            reviewFormMsg.textContent = "Posting...";

            try {
                await addDoc(collection(db, "reviews", currentReviewId, "comments"), {
                    name,
                    rating,
                    text,
                    isOwner,
                    userId: session.id,
                    photoURL: session.photoURL || null,
                    createdAt: Date.now()
                });

                commentRating.value = "";
                commentText.value = "";
                reviewFormMsg.style.color = "limegreen";
                reviewFormMsg.textContent = "Review posted!";
                delete trendingStatsCache[currentReviewId];
                // loadComments already calls persistVerdict internally
                await loadComments(currentReviewId);
            } catch (error) {
                console.error("Error posting review:", error);
                reviewFormMsg.style.color = "#e1282d";
                reviewFormMsg.textContent = "Error posting review. Please try again.";
            } finally {
                submitReviewBtn.disabled = false;
            }
        });
    </script>

</body>
