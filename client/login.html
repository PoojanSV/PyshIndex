<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In — Pysh Games</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">

<style>
body {
  background: black;
  font-family: Arial, sans-serif;
  margin: 0;
  color: white;
  min-height: 100vh;
}

header {
  background-color: #111;
  padding: 15px 50px;
  text-align: center;
}

header a { display: inline-block; }
header img { width: 130px; height: auto; }

hr { background-color: #e1282d; height: 5px; border: solid #e1282d; margin: 0; }

main {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 20px;
}

.authCard {
  background: #111;
  border: 3px solid #e1282d;
  border-radius: 25px;
  padding: 35px 40px;
  width: 100%;
  max-width: 400px;
}

.authCard h1 {
  font-size: 30px;
  text-align: center;
  margin: 0 0 5px;
}

.authSubtitle {
  text-align: center;
  color: #888;
  font-size: 14px;
  margin-bottom: 25px;
}

/* MODE TABS (Sign In / Sign Up) */
.authTabs {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.authTab {
  flex: 1;
  text-align: center;
  padding: 10px;
  border: 2px solid #e1282d;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  color: #ccc;
  transition: all 0.2s ease;
}

.authTab.active {
  background: #e1282d;
  color: white;
}

.authTab:hover:not(.active) { background: rgba(225,40,45,0.15); }

label {
  display: block;
  margin: 14px 0 6px;
  color: #ccc;
  font-size: 14px;
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 11px 13px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #000;
  color: white;
  font-family: inherit;
  font-size: 15px;
  box-sizing: border-box;
}

input:focus { outline: none; border-color: #e1282d; }

/* usernames are stored/lowercase only - reflect that visually as the user types */
#signinUsername,
#signupUsername {
  text-transform: lowercase;
}

/* Password field + show/hide toggle */
.pwField {
  position: relative;
}

.pwField input[type="password"],
.pwField input[type="text"] {
  padding-right: 44px;
}

.pwToggle {
  position: absolute;
  top: 50%;
  right: 6px;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: 6px;
  color: #888;
  cursor: pointer;
  padding: 0;
}

.pwToggle:hover { color: #e1282d; }
.pwToggle svg { width: 20px; height: 20px; pointer-events: none; }

.authBtn {
  width: 100%;
  margin-top: 22px;
  background: #e1282d;
  color: white;
  border: none;
  padding: 13px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}

.authBtn:hover { background: white; color: #e1282d; }
.authBtn:disabled { opacity: 0.6; cursor: not-allowed; }

.authMsg {
  margin-top: 14px;
  font-size: 14px;
  text-align: center;
  min-height: 18px;
}

.authDivider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom:25px;
  color: #555;
  font-size: 12px;
}
.authDivider::before, .authDivider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #333;
}

.guestBtn {
  width: 100%;
  background: transparent;
  color: #ccc;
  border: 2px solid #444;
  padding: 12px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}

.guestBtn:hover { border-color: #e1282d; color: white; }

.formSection { display: none; }
.formSection.active { display: block; }

@media (max-width: 500px) {
  header { padding: 15px 20px; }
  header img { width: 90px; }
  .authCard { padding: 25px 22px; border-radius: 18px; }
  .authCard h1 { font-size: 24px; }
}
</style>
</head>

<body>

<header>
  <a href="index.html"><img src="logo.png" alt="Pysh Games logo"></a>
</header>
<hr>

<main>
  <div class="authCard">
    <h1 id="authHeading">Welcome Surfer!</h1><br>
    

    <div class="authTabs">
      <div class="authTab active" data-mode="signin">Log In</div>
      <div class="authTab" data-mode="signup">Sign Up</div>
    </div>

    <!-- SIGN IN -->
    <div class="formSection active" id="signinSection">
      <label for="signinUsername">Username</label>
      <input type="text" id="signinUsername" placeholder="Your username" autocomplete="username">

      <label for="signinPassword">Password</label>
      <div class="pwField">
        <input type="password" id="signinPassword" placeholder="Your password" autocomplete="current-password">
        <button type="button" class="pwToggle" id="signinPasswordToggle" aria-label="Show password"></button>
      </div>

      <button class="authBtn" id="signinBtn">Sign In</button>
      <div class="authMsg" id="signinMsg"></div>
    </div>

    <!-- SIGN UP -->
    <div class="formSection" id="signupSection">
      <label for="signupUsername">Username</label>
      <input type="text" id="signupUsername" placeholder="Pick a username" autocomplete="username">

      <label for="signupPassword">Password</label>
      <div class="pwField">
        <input type="password" id="signupPassword" placeholder="At least 6 characters" autocomplete="new-password">
        <button type="button" class="pwToggle" id="signupPasswordToggle" aria-label="Show password"></button>
      </div>

      <label for="signupConfirm">Confirm Password</label>
      <div class="pwField">
        <input type="password" id="signupConfirm" placeholder="Retype your password" autocomplete="new-password">
        <button type="button" class="pwToggle" id="signupConfirmToggle" aria-label="Show password"></button>
      </div>

      <button class="authBtn" id="signupBtn">Create Account</button>
      <div class="authMsg" id="signupMsg"></div>
    </div>

    <div class="authDivider">OR</div>
    <button class="guestBtn" id="guestBtn">Continue as Guest</button>
 
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  doc,
  addDoc,
  getDocs,
  query,
  where,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoylOskSQPe1LiDehqp1gmSXfzzNNtRmY",
  authDomain: "pysh-index.firebaseapp.com",
  projectId: "pysh-index",
  appId: "1:263831699229:web:f514a3d8388868f6c9ebf4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ---- Auth session helpers (shared pattern across index.html, login.html, admin.html) ----
const AUTH_KEY = "pyshAuthUser";
function getSession() {
  try {
    return JSON.parse(localStorage.getItem(AUTH_KEY));
  } catch {
    return null;
  }
}
function setSession(session) {
  localStorage.setItem(AUTH_KEY, JSON.stringify(session));
}

// Normalize every username the same way, everywhere: trimmed, lowercase only.
function normalizeUsername(raw) {
  return raw.trim().toLowerCase();
}

// Where to go after a successful sign in / guest continue
const params = new URLSearchParams(window.location.search);
const redirectTarget = params.get("redirect") || "index.html";

// Already signed in? Skip straight through.
const existingSession = getSession();
if (existingSession) {
  window.location.href = redirectTarget;
}

// ---- Tab switching ----
const tabs = document.querySelectorAll(".authTab");
const signinSection = document.getElementById("signinSection");
const signupSection = document.getElementById("signupSection");
const authHeading = document.getElementById("authHeading");
const authSubtitle = document.getElementById("authSubtitle");

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const mode = tab.dataset.mode;
    if (mode === "signin") {
      signinSection.classList.add("active");
      signupSection.classList.remove("active");
      authHeading.textContent = "Welcome Surfer!";
      authSubtitle.textContent = "Sign in to rate and review games";
    } else {
      signupSection.classList.add("active");
      signinSection.classList.remove("active");
      authHeading.textContent = "Become a Surfer!";
      authSubtitle.textContent = "Join the community and start rating games";
    }
  });
});

// Force every username field to lowercase as the person types, so what they
// see always matches what will actually be checked/stored.
function lowercaseAsYouType(input) {
  input.addEventListener("input", () => {
    const pos = input.selectionStart;
    input.value = input.value.toLowerCase();
    input.setSelectionRange(pos, pos);
  });
}
lowercaseAsYouType(document.getElementById("signinUsername"));
lowercaseAsYouType(document.getElementById("signupUsername"));

// ---- Password show/hide toggles ----
const EYE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.3 21.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.32 21.32 0 0 1-3.22 4.39M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
const EYE_OFF_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;

function wirePasswordToggle(inputId, toggleId) {
  const input = document.getElementById(inputId);
  const toggle = document.getElementById(toggleId);
  toggle.innerHTML = EYE_ICON;
  toggle.addEventListener("click", () => {
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    toggle.innerHTML = isHidden ? EYE_OFF_ICON : EYE_ICON;
    toggle.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
  });
}

wirePasswordToggle("signinPassword", "signinPasswordToggle");
wirePasswordToggle("signupPassword", "signupPasswordToggle");
wirePasswordToggle("signupConfirm", "signupConfirmToggle");

// ---- Sign In ----
const signinBtn = document.getElementById("signinBtn");
const signinUsername = document.getElementById("signinUsername");
const signinPassword = document.getElementById("signinPassword");
const signinMsg = document.getElementById("signinMsg");

signinBtn.addEventListener("click", async () => {
  const username = normalizeUsername(signinUsername.value);
  const password = signinPassword.value;

  if (!username || !password) {
    signinMsg.style.color = "#e1282d";
    signinMsg.textContent = "Please enter your username and password.";
    return;
  }

  signinBtn.disabled = true;
  signinMsg.style.color = "#ccc";
  signinMsg.textContent = "Signing in...";

  try {
    // Usernames are always stored lowercase, so an exact match here is safe
    // no matter how the person capitalized it while typing.
    const q = query(collection(db, "users"), where("username", "==", username));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      signinMsg.style.color = "#e1282d";
      signinMsg.textContent = "No account found with that username.";
      return;
    }

    const userDoc = snapshot.docs[0];
    const userData = userDoc.data();

    if (userData.password !== password) {
      signinMsg.style.color = "#e1282d";
      signinMsg.textContent = "Incorrect password.";
      return;
    }

    setSession({
      id: userDoc.id,
      username: userData.username,
      role: userData.role || "user",
      photoURL: userData.photoURL || null
    });

    signinMsg.style.color = "limegreen";
    signinMsg.textContent = "success";
    window.location.href = redirectTarget;
  } catch (error) {
    console.error("Error signing in:", error);
    signinMsg.style.color = "#e1282d";
    signinMsg.textContent = "Something went wrong. Please try again.";
  } finally {
    signinBtn.disabled = false;
  }
});

[signinUsername, signinPassword].forEach(input => {
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") signinBtn.click();
  });
});

// ---- Sign Up ----
const signupBtn = document.getElementById("signupBtn");
const signupUsername = document.getElementById("signupUsername");
const signupPassword = document.getElementById("signupPassword");
const signupConfirm = document.getElementById("signupConfirm");
const signupMsg = document.getElementById("signupMsg");

signupBtn.addEventListener("click", async () => {
  const username = normalizeUsername(signupUsername.value);
  const password = signupPassword.value;
  const confirm = signupConfirm.value;

  if (!username || !password || !confirm) {
    signupMsg.style.color = "#e1282d";
    signupMsg.textContent = "Please fill in every field.";
    return;
  }
  if (password.length < 6) {
    signupMsg.style.color = "#e1282d";
    signupMsg.textContent = "Password must be at least 6 characters.";
    return;
  }
  if (password !== confirm) {
    signupMsg.style.color = "#e1282d";
    signupMsg.textContent = "Passwords don't match.";
    return;
  }

  signupBtn.disabled = true;
  signupMsg.style.color = "#ccc";
  signupMsg.textContent = "Creating";

  try {
    const newUser = {
      username, // already lowercase
      password,
      role: "user",
      photoURL: null,
      createdAt: Date.now()
    };

    // A plain "query, then addDoc if nothing found" has a race condition:
    // two people submitting the same username at the same moment could both
    // pass the check before either write lands, creating two accounts with
    // the same name. To close that gap, "usernames" is used as a uniqueness
    // lock: its document ID *is* the lowercase username, and the whole
    // check-and-create runs inside one atomic transaction, so only one of
    // two simultaneous signups can ever win.
    const usernameLockRef = doc(db, "usernames", username);
    let newUserId;

    await runTransaction(db, async (transaction) => {
      const lockSnap = await transaction.get(usernameLockRef);
      if (lockSnap.exists()) {
        throw new Error("USERNAME_TAKEN");
      }

      const newUserRef = doc(collection(db, "users"));
      newUserId = newUserRef.id;

      transaction.set(newUserRef, newUser);
      transaction.set(usernameLockRef, {
        userId: newUserRef.id,
        createdAt: newUser.createdAt
      });
    });

    setSession({
      id: newUserId,
      username: newUser.username,
      role: newUser.role,
      photoURL: null
    });

    signupMsg.style.color = "limegreen";
    signupMsg.textContent = "Account created!";
    window.location.href = redirectTarget;
  } catch (error) {
    if (error.message === "USERNAME_TAKEN") {
      signupMsg.style.color = "#e1282d";
      signupMsg.textContent = "That username is already taken.";
    } else {
      console.error("Error signing up:", error);
      signupMsg.style.color = "#e1282d";
      signupMsg.textContent = "Something went wrong. Please try again.";
    }
  } finally {
    signupBtn.disabled = false;
  }
});

[signupUsername, signupPassword, signupConfirm].forEach(input => {
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") signupBtn.click();
  });
});

// ---- Continue as Guest ----
// Guests get no session at all - the rest of the site already treats "no session"
// as a guest: they can browse and read reviews, but the review form stays hidden.
document.getElementById("guestBtn").addEventListener("click", () => {
  window.location.href = redirectTarget === "admin.html" ? "index.html" : redirectTarget;
});
</script>

</body>
</html>
